<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save:On 평가</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101117;color:#f4f4f7}header{padding:20px 28px;border-bottom:1px solid #30303b}h1{margin:0;font-size:23px}p{color:#babac7}main{display:grid;grid-template-columns:280px 1fr;min-height:90vh}aside{border-right:1px solid #30303b;padding:20px;overflow:auto}section{padding:24px;min-width:0}button,select,input,textarea{font:inherit;color:inherit;background:#20212a;border:1px solid #444554;border-radius:8px;padding:9px}button{cursor:pointer}button:hover,.active{border-color:#df56bb}aside button{display:block;width:100%;text-align:left;margin:6px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#191a22;border:1px solid #30303b;border-radius:12px;padding:16px;min-width:0}textarea{box-sizing:border-box;width:100%;min-height:210px;font-family:monospace;font-size:13px;resize:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:400px;overflow:auto}label{display:block;margin:12px 0 5px}a{color:#f195dc}small{color:#b9b9c8}.banner{color:#f2c27b}summary{cursor:pointer;margin:10px 0}#message{min-height:25px}@media(max-width:850px){main{display:block}aside{border:0}.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>Save:On · 평가 데이터</h1><p>정답과 분석 결과를 나란히 확인합니다. 점수는 자동으로 매기지 않습니다.</p><label>개발자 토큰 (설정한 경우에만 입력) <input id="token" type="password" autocomplete="off"></label><button id="load">목록 불러오기</button></header>
<main><aside><h3>평가 영상 추가</h3><label for="new-url">영상 링크</label><input id="new-url" type="url" placeholder="YouTube 또는 Instagram" style="box-sizing:border-box;width:100%"><label for="new-title">제목 (선택)</label><input id="new-title" style="box-sizing:border-box;width:100%" placeholder="예: 화장품 추천"><button id="add">영상 추가</button><h3>평가 영상</h3><div id="list"></div></aside><section><div id="message"></div><div id="detail">왼쪽에서 영상을 선택하세요.</div></section></main>
<script>
const $=id=>document.getElementById(id); let current=null;
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Developer-Token':$('token').value,...options.headers}});if(!response.ok){let err;try{err=(await response.json()).detail}catch{}throw Error(err||`요청 실패 (${response.status})`)}return response.json()}
function text(tag,value){const el=document.createElement(tag);el.textContent=value??'';return el}
function field(parent,label,value){parent.append(text('label',label));const area=document.createElement('textarea');area.value=JSON.stringify(value??{},null,2);parent.append(area);return area}
function goldEditor(parent,area){let data;try{data=JSON.parse(area.value)}catch{parent.append(text('p','JSON 형식 오류를 수정한 뒤 다시 불러와 주세요.'));return}if(!data||Array.isArray(data)||typeof data!=='object'){parent.append(text('p','정답은 JSON 객체여야 합니다.'));return}const container=document.createElement('div');parent.append(container);const sync=()=>{area.value=JSON.stringify(data,null,2)};const newId=()=>`draft-${crypto.randomUUID()}`;
function listEditor(owner,key,label){if(!Array.isArray(owner[key]))owner[key]=[];const section=document.createElement('div');container.append(section);const draw=()=>{section.replaceChildren();section.append(text('h4',label));owner[key].forEach((entry,i)=>{if(!entry||typeof entry!=='object')return;const row=document.createElement('div');row.style.marginBottom='8px';const input=document.createElement('input');input.style.width='75%';input.value=entry.text||'';input.placeholder='내용 입력';input.oninput=()=>{entry.text=input.value;sync()};const remove=text('button','삭제');remove.onclick=()=>{owner[key].splice(i,1);sync();draw()};row.append(input,remove);section.append(row)});const add=text('button','+ 내용 추가');add.onclick=()=>{owner[key].push({id:newId(),text:'',evidence:[]});sync();draw()};section.append(add)};draw()}
function targets(){if(!Array.isArray(data.targets))data.targets=[];const section=document.createElement('div');container.append(section);const draw=()=>{section.replaceChildren();data.targets.forEach((target,i)=>{if(!target||typeof target!=='object')return;const card=document.createElement('div');card.className='panel';card.style.marginTop='12px';section.append(card);card.append(text('label',`대상 ${i+1} 이름 (제품·장소·운동 등)`));const name=document.createElement('input');name.style.width='75%';name.value=target.name||'';name.oninput=()=>{target.name=name.value;sync()};card.append(name);const del=text('button','대상 삭제');del.onclick=()=>{data.targets.splice(i,1);sync();draw()};card.append(del);if(!Array.isArray(target.requiredFacts))target.requiredFacts=[];const facts=document.createElement('div');card.append(facts);const drawFacts=()=>{facts.replaceChildren();facts.append(text('label','필수 정보'));target.requiredFacts.forEach((fact,j)=>{const line=document.createElement('div');const input=document.createElement('input');input.style.width='75%';input.placeholder='예: 딸기우유 같은 색감';input.value=fact.text||'';input.oninput=()=>{fact.text=input.value;sync()};const remove=text('button','삭제');remove.onclick=()=>{target.requiredFacts.splice(j,1);sync();drawFacts()};line.append(input,remove);facts.append(line)});const add=text('button','+ 필수 정보');add.onclick=()=>{target.requiredFacts.push({id:newId(),text:'',evidence:[]});sync();drawFacts()};facts.append(add)};drawFacts()});const add=text('button','+ 제품·장소·운동 등 추가');add.onclick=()=>{data.targets.push({id:newId(),name:'',type:'OTHER',requiredFacts:[],optionalFacts:[],steps:[],externalExpectations:[]});sync();draw()};section.append(add)};draw()}
targets();listEditor(data,'requiredFacts','영상 전체 필수 정보');listEditor(data,'globalSteps','전체 순서');sync()}
async function load(){try{const items=await api('/admin/evaluations');$('list').replaceChildren();for(const entry of items){const item=entry.item,b=text('button',`${item.id} · ${item.source?.title||item.source?.url||''}${item.evaluationStatus==='EXCLUDED'?' (제외)':''}`);b.onclick=()=>show(item.id);$('list').append(b)}}catch(e){$('message').textContent=e.message}}
$('add').onclick=async()=>{const button=$('add');button.disabled=true;try{const entry=await api('/admin/evaluations',{method:'POST',body:JSON.stringify({url:$('new-url').value,title:$('new-title').value})});$('new-url').value='';$('new-title').value='';await load();await show(entry.item.id);$('message').textContent='평가 영상을 추가했습니다. 정답은 아직 작성되지 않았습니다.'}catch(e){$('message').textContent='추가 실패: '+e.message}finally{button.disabled=false}};
function addPromptWorkshop(parent, item, run) {
  if (!['COMPLETED', 'REPLAY'].includes(run.status) || !run.stt?.length && !run.ocr?.length) return;
  const box = document.createElement('details');
  box.append(text('summary', '공통 예시 만들기 · 다른 영상에서 비교'));
  box.append(text('p', '현재 영상은 예시 생성에서 제외됩니다. 다른 영상 2개 이상에 요약 오류가 잡힌 AI 평가 초안이 필요합니다.'));
  const propose = text('button', '반복 오류에서 공통 예시 제안');
  const select = document.createElement('select');
  select.setAttribute('aria-label', '비교할 예시 후보');
  const compare = text('button', '같은 근거로 기존·새 프롬프트 비교');
  compare.disabled = true;
  const display = document.createElement('div');
  const status = text('p', '');
  status.setAttribute('role', 'status');
  box.append(propose, select, compare, display, status);
  parent.append(box);
  let candidates = [];
  let loaded = false;
  let busy = false;
  const onPick = () => {
    const candidate = candidates.find(entry => entry.id === select.value);
    display.replaceChildren();
    if (candidate) {
      display.append(text('p', '예시 생성에 사용한 영상 · ' + candidate.sourceItemIds.join(', ')));
      for (const example of candidate.examples) {
        display.append(text('h4', example.pattern));
        display.append(text('p', '가상 입력 · ' + example.exampleInput));
        display.append(text('p', '기대 요약 · ' + example.exampleOutput));
      }
    }
    compare.disabled = busy || !candidate || candidate.sourceItemIds.includes(item.id);
  };
  function options(preferred) {
    const blank = text('option', '예시 후보 선택');
    blank.value = '';
    select.replaceChildren(blank);
    for (const candidate of candidates) {
      const option = text('option', candidate.examples[0].pattern);
      option.value = candidate.id;
      select.append(option);
    }
    select.value = preferred || '';
    onPick();
  }
  select.onchange = onPick;
  const path = '/admin/evaluations/prompt-workshop/candidates';
  box.ontoggle = async () => {
    if (!box.open || loaded) return;
    try { candidates = await api(path); loaded = true; options(); }
    catch (error) { status.textContent = error.message; }
  };
  propose.onclick = async () => {
    busy = true; propose.disabled = true; onPick();
    status.textContent = '다른 영상의 오류에서 반복 패턴을 찾고 있어요.';
    try {
      const candidate = await api(path, {method:'POST', body:JSON.stringify({holdoutItemId:item.id})});
      if (candidate.id) {
        candidates = [candidate, ...candidates];
        options(candidate.id);
        status.textContent = '예시 후보를 저장했습니다. 가상 예시를 확인한 뒤 비교하세요.';
      } else status.textContent = '현재 평가 초안에서는 공통 예시로 만들 만한 반복 오류가 확인되지 않았습니다.';
    } catch (error) { status.textContent = error.message; }
    finally { busy = false; propose.disabled = false; onPick(); }
  };
  compare.onclick = async () => {
    busy = true; propose.disabled = true; onPick();
    status.textContent = '동일한 저장 근거로 요약 두 건을 생성하고 있어요.';
    try {
      const trial = '/admin/evaluations/' + encodeURIComponent(item.id) + '/runs/' + encodeURIComponent(run.id) + '/prompt-comparisons';
      const result = await api(trial, {method:'POST', body:JSON.stringify({candidateId:select.value})});
      await show(item.id, result.prompt_candidate);
      $('message').textContent = '비교용 결과 두 건을 저장했습니다. 아래 비교 영역을 확인하세요.';
    } catch (error) { status.textContent = error.message; }
    finally { busy = false; propose.disabled = false; onPick(); }
  };
}
function addAIReview(parent, item, run, savedDraft) {
  if (!['COMPLETED', 'REPLAY'].includes(run.status) || !run.gemini?.summary?.trim()) return;
  const box = document.createElement('div');
  const button = text('button', 'AI 평가 초안');
  const area = document.createElement('div');
  area.setAttribute('role', 'status');
  box.append(button, area);
  parent.append(box);
  const evidence = new Map([...(run.stt || []), ...(run.ocr || [])].map(unit => [unit.id, unit]));
  const labels = {INCORRECT:'잘못된 내용 후보', MISSING:'누락 후보', INSUFFICIENT_EVIDENCE:'근거 부족', FORMAT:'표현·형식'};
  const locations = {SUMMARY:'요약', EXTRACTION:'근거 추출', UNCLEAR:'판단 어려움'};
  function display(draft) {
    button.disabled = true;
    area.replaceChildren(text('p', '저장된 STT·OCR 기준의 AI 검토 초안 · ' + draft.model));
    if (!draft.findings.length) area.append(text('p', '저장된 근거에서 뚜렷한 문제 후보를 찾지 못했습니다.'));
    for (const finding of draft.findings) {
      const row = document.createElement('details');
      row.append(text('summary', (labels[finding.kind] || finding.kind) + ' · ' + finding.passage));
      row.append(text('p', (locations[finding.location] || '') + ' · ' + finding.explanation));
      for (const id of finding.evidenceIds) {
        const unit = evidence.get(id);
        if (!unit) continue;
        const time = unit.startMs ?? unit.timeMs;
        const at = Number.isFinite(time) ? ' · ' + (time / 1000).toFixed(1) + '초' : '';
        row.append(text('p', id + at + ' · ' + unit.text));
      }
      row.append(text('p', '수정 제안 · ' + finding.suggestion));
      if (finding.suggestion && finding.kind !== 'INSUFFICIENT_EVIDENCE' && finding.location === 'SUMMARY') {
        const copy = text('button', '이 제안을 재요약 의견에 넣기');
        copy.onclick = () => {
          const editor = parent.querySelector('textarea[aria-label="검토 의견"]');
          if (!editor) return;
          const details = editor.closest('details');
          if (details) details.open = true;
          editor.value = [editor.value.trim(), finding.suggestion].filter(Boolean).join(String.fromCharCode(10)).slice(0, 2000);
          editor.focus();
        };
        row.append(copy);
      }
      area.append(row);
    }
  }
  if (savedDraft) { display(savedDraft); return; }
  if (!evidence.size) {
    button.disabled = true;
    area.append(text('p', '저장된 STT·OCR이 있는 실행을 선택하세요.'));
    return;
  }
  button.onclick = async () => {
    button.disabled = true;
    area.textContent = '저장된 근거와 요약을 비교하고 있어요.';
    try {
      const path = '/admin/evaluations/' + encodeURIComponent(item.id) + '/runs/' + encodeURIComponent(run.id) + '/ai-review';
      const draft = await api(path, {method: 'POST'});
      if (current?.item?.id === item.id) (current.aiDrafts ??= {})[run.id] = draft;
      display(draft);
    } catch (error) {
      area.textContent = error.message;
      button.disabled = false;
    }
  };
}
function addRevisionControl(parent, item, run, review) {
  if (!['COMPLETED', 'REPLAY'].includes(run.status) || !run.gemini?.summary?.trim()) return;
  const editor = document.createElement('details');
  editor.append(text('summary', '요약 수정 또는 의견으로 다시 요약'));
  const feedback = document.createElement('textarea');
  feedback.maxLength = 2000;
  feedback.placeholder = '예: 제품을 립스틱이 아니라 립밤으로 분류. 가격은 영상 속 표기일 때만 표시.';
  feedback.setAttribute('aria-label', '검토 의견');
  if (!review?.stale) feedback.value = review?.data?.notes || '';
  const desired = document.createElement('textarea');
  desired.maxLength = 4000;
  desired.placeholder = '직접 수정할 요약 또는 Gemini에 보여줄 원하는 예시';
  desired.setAttribute('aria-label', '수정 요약 또는 출력 예시');
  const copy = text('button', '현재 요약 복사해서 수정');
  copy.onclick = () => { desired.value = run.gemini.summary; desired.focus(); };
  const manual = text('button', '직접 수정본 저장');
  const regenerate = text('button', '의견으로 Gemini 다시 요약');
  const status = text('p', '');
  status.setAttribute('role', 'status');
  const hasEvidence = Boolean(run.stt?.length || run.ocr?.length);
  editor.append(text('p', '직접 수정본은 입력한 문장 그대로 저장됩니다. Gemini 재요약은 검토 의견과 선택적으로 입력한 예시를 사용합니다. 둘 다 새 평가 결과로 저장됩니다.'),
    text('label','검토 의견 (선택)'), feedback, text('label','수정할 요약 / 원하는 예시'), desired, copy, manual, regenerate, status);
  regenerate.disabled = !hasEvidence;
  if (!hasEvidence) status.textContent = '이 실행에는 재요약에 필요한 STT·OCR 근거가 저장되어 있지 않습니다.';
  async function submit(mode) {
    manual.disabled = regenerate.disabled = true;
    try {
      const child = await api('/admin/evaluations/' + encodeURIComponent(item.id) + '/runs/' + encodeURIComponent(run.id) + '/revisions', {
        method: 'POST',
        body: JSON.stringify({mode, feedback: feedback.value, desiredSummary: desired.value}),
      });
      await show(item.id, child.id);
      $('message').textContent = mode === 'manual'
        ? '수정본을 평가 결과로 저장했습니다. 아래 비교 영역에서 원본과 확인하세요.'
        : '재요약을 시작했습니다. 잠시 후 분석 상태 확인을 눌러 결과를 불러오세요.';
    } catch (error) {
      status.textContent = error.message;
    } finally {
      manual.disabled = false;
      regenerate.disabled = !hasEvidence;
    }
  }
  manual.onclick = () => submit('manual');
  regenerate.onclick = () => submit('feedback');
  parent.append(editor);
}
function addPublicationControl(parent, item, run) {
  if (!['COMPLETED', 'REPLAY'].includes(run.status) || !run.gemini?.summary?.trim()
      || run.gemini.structured?.analysisQuality === 'FALLBACK') return;
  const area = document.createElement('div');
  const choose = text('button', '기존 보관함 항목에 반영');
  const feedback = text('p', '');
  feedback.setAttribute('role', 'status');
  area.append(choose, feedback);
  parent.append(area);
  const base = '/admin/evaluations/' + encodeURIComponent(item.id);
  choose.onclick = async () => {
    choose.disabled = true;
    try {
      const choices = await api(base + '/publication-targets');
      if (!choices.length) {
        feedback.textContent = '반영할 수 있는 기존 항목이 없습니다. 같은 영상이 완료 상태로 저장되어 있는지 확인하세요. 직접 수정한 항목에는 덮어쓰지 않습니다.';
        return;
      }
      const select = document.createElement('select');
      select.setAttribute('aria-label', '반영할 보관함 영상');
      const placeholder = text('option', '기존 항목 선택');
      placeholder.value = '';
      select.append(placeholder);
      for (const candidate of choices) {
        const option = text('option', '#' + candidate.id + ' · ' + (candidate.title || item.id));
        option.value = String(candidate.id);
        select.append(option);
      }
      const apply = text('button', '선택한 항목에 요약 저장');
      apply.disabled = true;
      select.onchange = () => { apply.disabled = !select.value; };
      feedback.replaceChildren(select, apply);
      apply.onclick = async () => {
        const target = choices.find(candidate => String(candidate.id) === select.value);
        if (!target || !window.confirm('보관함 #' + target.id + '의 요약을 선택한 평가 결과로 바꿀까요?')) return;
        apply.disabled = true;
        try {
          await api(base + '/runs/' + encodeURIComponent(run.id) + '/publication', {
            method: 'PUT',
            body: JSON.stringify({contentId: target.id, expectedAnalyzedAt: target.analyzedAt}),
          });
          feedback.textContent = '보관함 #' + target.id + '에 반영했습니다. 앱을 새로고침하고 같은 영상을 열어 확인하세요.';
        } catch (error) {
          feedback.textContent = error.message;
        }
      };
    } catch (error) {
      feedback.textContent = error.message;
    } finally {
      choose.disabled = false;
    }
  };
}
function addJSON(parent,title,value){const details=document.createElement('details');details.append(text('summary',title));const pre=text('pre',JSON.stringify(value,null,2));details.append(pre);parent.append(details)}
function goldItems(gold){const out=[];function put(key,heading,value){if(typeof value==='string'&&value.trim())out.push({key,heading,value})}function entries(prefix,label,values){if(!Array.isArray(values))return;values.forEach((v,i)=>{if(v&&typeof v==='object')put(prefix+'/'+i,label,v.text)})}entries('requiredFacts','공통 필수 정보',gold?.requiredFacts);entries('globalSteps','전체 순서',gold?.globalSteps);if(Array.isArray(gold?.targets))gold.targets.forEach((target,i)=>{if(!target||typeof target!=='object')return;put('targets/'+i+'/name','대상',target.name);entries('targets/'+i+'/requiredFacts',`${target.name||'대상'} · 필수 정보`,target.requiredFacts);entries('targets/'+i+'/steps',`${target.name||'대상'} · 순서`,target.steps)});return out}
function buildComparison(root,data){const {item,runs,reviews,revision}=data;if(!runs.length)return;const block=document.createElement('div');block.className='panel';block.style.marginTop='16px';root.append(block);block.append(text('h3','개선 전후 비교와 정답 검토'));block.append(text('p','왼쪽과 오른쪽에서 서로 다른 실행을 선택하세요. 같은 정답 항목을 양쪽에 보여주는 이유는 실행별로 누락·오류를 따로 기록하기 위해서입니다. 평가는 직접 선택하며 자동으로 판정하지 않습니다.'));const expected=goldItems(item.gold);if(!expected.length)block.append(text('p','대상, 필수 정보 또는 순서가 정답에 아직 없습니다. 위 정답 JSON을 작성하고 저장하면 검토 항목으로 나타납니다.'));else block.append(text('small',`정답 검토 항목 ${expected.length}개 · 라벨 상태: ${item.annotation?.status||'DRAFT'}`));const cols=document.createElement('div');cols.className='grid';block.append(cols);
 function makeColumn(title,initial){const column=document.createElement('div');column.className='panel';cols.append(column);column.append(text('h4',title));const select=document.createElement('select');for(const run of runs){const o=text('option',`${run.label} · ${run.status}`);o.value=run.id;select.append(o)}select.value=initial;column.append(select);const content=document.createElement('div');column.append(content);
 function draw(){content.replaceChildren();const run=runs.find(x=>x.id===select.value),review=reviews?.[run.id],old=review?.stale;content.append(text('p',`상태: ${run.status} · ${run.startedAt||'시각 기록 없음'}`));content.append(text('h4','앱에 전달되는 요약'));content.append(text('pre',run.gemini?.summary||'요약 없음'));if(old)content.append(text('p','정답이 수정되어 이전 검토는 오래된 상태입니다. 다시 판단하고 저장해 주세요.'));const states={UNREVIEWED:'미검토',CORRECT:'정확함',MISSING:'누락',INCORRECT:'잘못됨',UNCLEAR:'판단 어려움'};const selects={};for(const entry of expected){const box=document.createElement('div');box.style.borderTop='1px solid #383844';box.append(text('p',`${entry.heading}: ${entry.value}`));const field=document.createElement('select');for(const [value,label] of Object.entries(states)){const o=text('option',label);o.value=value;field.append(o)}field.value=old?'UNREVIEWED':(review?.data?.judgments?.[entry.key]||'UNREVIEWED');box.append(field);selects[entry.key]=field;content.append(box)}content.append(text('label','잘못되거나 불필요한 출력·근거에 대한 메모'));const note=document.createElement('textarea');note.style.minHeight='90px';note.value=review?.data?.notes||'';content.append(note);const save=text('button','이 결과의 검토 저장');content.append(save);save.onclick=async()=>{save.disabled=true;try{const judgments=Object.fromEntries(Object.entries(selects).map(([k,v])=>[k,v.value]));await api('/admin/evaluations/'+encodeURIComponent(item.id)+'/reviews/'+encodeURIComponent(run.id),{method:'PUT',body:JSON.stringify({revision:review?.revision||0,goldRevision:revision,judgments,notes:note.value})});const refreshed=await api('/admin/evaluations/'+encodeURIComponent(item.id));Object.assign(reviews,refreshed.reviews);current.reviews=reviews;draw();$('message').textContent='검토 내용을 저장했습니다.'}catch(e){$('message').textContent='검토 저장 실패: '+e.message}finally{save.disabled=false}};addJSON(content,'STT',run.stt);addJSON(content,'OCR',run.ocr);addJSON(content,'Gemini 구조화 결과',run.gemini?.structured)}select.onchange=draw;draw()}
 block.dataset.comparison='true';const edited=runs.find(r=>r.status==='COMPLETED'&&r.raw?.content?.evaluationConfig?.parentRunId);const parentId=edited?.raw?.content?.evaluationConfig?.parentRunId;const trial=runs.find(r=>r.raw?.content?.evaluationConfig?.promptVariant==='prompt_candidate');const comparisonId=trial?.raw?.content?.evaluationConfig?.comparisonId;const paired=trial&&runs.find(r=>r.raw?.content?.evaluationConfig?.comparisonId===comparisonId&&r.raw.content.evaluationConfig.promptVariant==='prompt_baseline');const before=paired||runs.find(r=>r.id===parentId)||runs.find(r=>r.id==='replay-baseline')||runs.find(r=>r.id==='baseline')||runs[runs.length-1];const after=trial||edited||runs.find(r=>r.id==='replay-fewshot')||runs[0];makeColumn('비교할 실행 A',before.id);makeColumn('비교할 실행 B',after.id)}
async function show(id, selectedRunId){try{current=await api('/admin/evaluations/'+encodeURIComponent(id));render(selectedRunId)}catch(e){$('message').textContent=e.message}}
function render(selectedRunId){const {item,runs,revision}=current;const root=$('detail');root.replaceChildren();$('message').textContent='';root.append(text('h2',`${item.id} · ${item.source?.title||'제목 미입력'}`));const link=text('a','원본 영상 열기');link.href=item.source?.url||'#';link.target='_blank';link.rel='noopener noreferrer';root.append(link);root.append(text('p',`평가 상태: ${item.evaluationStatus||'포함'} · 라벨: ${item.annotation?.status||'DRAFT'} · 수정 버전 ${revision}`));
 const grid=document.createElement('div');grid.className='grid';root.append(grid);const left=document.createElement('div');left.className='panel';grid.append(left);left.append(text('h3','사람이 작성한 정답'));left.append(text('small','영상 근거를 확인하면서 제품·장소·정보를 입력하세요. 초안은 검토 전 상태로 표시됩니다.'));const form=document.createElement('div');left.append(form);const advanced=document.createElement('details');advanced.append(text('summary','고급: JSON 직접 수정'));left.append(advanced);const gold=field(advanced,'정답 (gold)',item.gold);const annotation=field(advanced,'검토 상태 및 메모 (annotation)',item.annotation);const reload=text('button','JSON 내용을 입력란에 불러오기');advanced.append(reload);reload.onclick=()=>{form.replaceChildren();goldEditor(form,gold)};goldEditor(form,gold);const save=text('button','정답 저장');left.append(save);save.onclick=async()=>{try{const body={revision:current.revision,gold:JSON.parse(gold.value),annotation:JSON.parse(annotation.value)};await api('/admin/evaluations/'+encodeURIComponent(item.id),{method:'PUT',body:JSON.stringify(body)});await show(item.id);$('message').textContent='저장했습니다.'}catch(e){$('message').textContent='저장 실패: '+e.message}};
 const right=document.createElement('div');right.className='panel';grid.append(right);right.append(text('h3','한 실행의 상세 결과'));const runButton=text('button','이 영상 분석 실행');runButton.disabled=item.evaluationStatus==='EXCLUDED'||runs.some(r=>['SUBMITTING','PENDING','ANALYZING','RUNNING'].includes(r.status));const variant=document.createElement('select');for(const [v,label] of [['baseline','기존 지시'],['few_shot_v1','예시 추가 실험'],['structured_v2','구조 규칙 v2']]){const option=text('option',label);option.value=v;variant.append(option)}right.append(variant,runButton);right.append(text('p','평가 전용 분석은 보관함에 저장하지 않으며 Gemini 무료 할당량을 사용합니다. 예시 추가는 실험이며 앱의 기본 설정을 바꾸지 않습니다.'));runButton.onclick=async()=>{runButton.disabled=true;try{const run=await api('/admin/evaluations/'+encodeURIComponent(item.id)+'/runs',{method:'POST',body:JSON.stringify({promptVariant:variant.value})});await show(item.id);$('message').textContent=run.error||'분석 요청을 보냈습니다. 아래에서 상태 확인을 눌러주세요.'}catch(e){$('message').textContent='분석 요청 실패: '+e.message;runButton.disabled=false}};if(!runs.length){right.append(text('p','저장된 분석 결과가 없습니다.'));return}const select=document.createElement('select');for(const run of runs){const option=text('option',run.label);option.value=run.id;select.append(option)}right.append(select);const view=document.createElement('div');right.append(view);function draw(){view.replaceChildren();const run=runs.find(x=>x.id===select.value);view.append(text('p',`상태: ${run.status} · 실행 시각: ${run.startedAt||'기록 없음'} · 소요 시간: ${run.elapsedSeconds==null?'기록 없음':run.elapsedSeconds+'초'}`));if(run.error)view.append(text('p',run.error));if(['SUBMITTING','PENDING','ANALYZING','RUNNING'].includes(run.status)){const refresh=text('button','분석 상태 확인');view.append(refresh);refresh.onclick=async()=>{refresh.disabled=true;try{await api('/admin/evaluations/'+encodeURIComponent(item.id)+'/runs/'+encodeURIComponent(run.id)+'/refresh',{method:'POST'});await show(item.id)}catch(e){$('message').textContent=e.message;refresh.disabled=false}}}view.append(text('p','STT 및 OCR은 선택한 실행에 저장된 결과만 표시합니다. 빈 목록은 추출 실패가 아니라 저장 기록이 없을 수도 있습니다.'));addJSON(view,`STT (${run.stt.length})`,run.stt);addJSON(view,`OCR (${run.ocr.length})`,run.ocr);view.append(text('h4','Gemini 정리'));view.append(text('pre',run.gemini.summary||'저장된 요약 없음'));addAIReview(view,item,run,current.aiDrafts?.[run.id]);addPromptWorkshop(view,item,run);addRevisionControl(view,item,run,current.reviews?.[run.id]);addPublicationControl(view,item,run);addJSON(view,'Gemini 구조화 결과 JSON',run.gemini.structured);addJSON(view,'실행 원본 JSON',run.raw)}if(runs.some(run=>run.id===selectedRunId))select.value=selectedRunId;select.onchange=draw;draw();buildComparison(root,current)}
$('load').onclick=load;load();
</script></body></html>
