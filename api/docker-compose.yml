services:
  postgres:
    image: postgres:16
    container_name: saveon-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: saveon
      POSTGRES_USER: saveon
      POSTGRES_PASSWORD: saveon1234

    ports:
      - "5432:5432"

    volumes:
      - saveon_postgres_data:/var/lib/postgresql/data

volumes:
  saveon_postgres_data: