services:
  minio:
    image: minio/minio:latest
    container_name: saveon-thumb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: saveonlocal
      MINIO_ROOT_PASSWORD: saveonlocal123
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - saveon_minio_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: saveon-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: saveon
      POSTGRES_USER: saveon
      POSTGRES_PASSWORD: saveon1234

    ports:
      - "5432:5432"

    volumes:
      - saveon_postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  saveon_minio_data:
  saveon_postgres_data:
# SAVEON_INSTAGRAM_THUMBNAIL_V1
