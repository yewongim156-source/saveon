spring.application.name=saveon-api

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/saveon}
spring.datasource.username=${DB_USERNAME:saveon}
spring.datasource.password=${DB_PASSWORD:saveon1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

server.port=${PORT:8080}

saveon.ai.base-url=${SAVEON_AI_BASE_URL:http://localhost:8000}
saveon.search.semantic-default-limit=20
saveon.search.semantic-max-limit=50

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.max-part-header-size=8KB
